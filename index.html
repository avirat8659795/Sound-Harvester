<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Sound Harvester — Spotify Playlist to MP3 & Streamer</title>
    <meta name="description" content="Sound Harvester: Extract, stream, and download Spotify playlists with real-time lyrics, lock-screen background playback, and mobile notification controls." />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SoundHarvest" />
    <meta name="application-name" content="SoundHarvest" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <meta name="theme-color" content="#121212" />

    <meta property="og:title" content="Sound Harvester" />
    <meta property="og:description" content="Sound Harvester: Extract, stream, and download Spotify playlists with real-time lyrics and audio player." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-[#121212] text-white">
    <div id="root"></div>
    <script>
      // Graceful error catcher for mobile browsers
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          console.error('Mobile script load error:', e);
          root.innerHTML = '<div style="min-height:100vh;background:#121212;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:sans-serif;"><div style="width:52px;height:52px;border-radius:14px;background:rgba(29,185,84,0.2);border:1px solid rgba(29,185,84,0.4);display:flex;align-items:center;justify-content:center;margin-bottom:16px;"><span style="font-size:22px;font-weight:900;color:#1DB954;">H</span></div><h2 style="font-size:18px;font-weight:bold;margin-bottom:8px;">Sound Harvester</h2><p style="font-size:13px;color:#a0a0a0;max-width:300px;margin-bottom:20px;">Unable to initialize mobile interface. Tap below to clear cache and reload.</p><button onclick="if(window.caches){caches.keys().then(function(k){k.forEach(function(n){caches.delete(n);});});}window.location.reload(true);" style="background:#1DB954;color:#000;font-weight:bold;padding:10px 22px;border-radius:9999px;border:none;font-size:13px;cursor:pointer;">Clear Cache & Reload</button></div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
